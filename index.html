<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DASHBOARD CONTROL CENTER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background: #070913; color: #f1f5f9; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass { background: rgba(20, 24, 45, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .input-dark { background: rgba(5, 6, 15, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); color: #f1f5f9; }
        .input-dark:focus { outline: none; border-color: #3b82f6; }
        
        .slide-sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #ffffff !important; color: #0f172a !important; box-shadow: 10px 0 40px rgba(0,0,0,0.5); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999; }
        .slide-sidebar.open { left: 0; }
        .slide-sidebar button { color: #334155; font-weight: 600; width: 100%; text-align: left; padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
        .slide-sidebar button:hover { background: rgba(0,0,0,0.04); color: #020617; }
        .sidebar-active { background: rgba(59, 130, 246, 0.08) !important; color: #1d4ed8 !important; border-left: 4px solid #1d4ed8 !important; border-radius: 0px 12px 12px 0px !important; }

        #draggableShortcut { touch-action: none; user-select: none; z-index: 999; }
    </style>
</head>
<body class="min-h-screen">

<!-- PEMICU UTAMA DI POJOK KIRI ATAS UNTUK MEMUNCULKAN DASBOR -->
<div class="fixed top-4 left-4 z-50">
    <button onclick="toggleSidebar()" class="w-10 h-10 rounded-xl bg-slate-900/80 border border-white/10 text-white flex items-center justify-center shadow-lg active:scale-95 transition cursor-pointer">
        <i class="fa-solid fa-bars text-sm"></i>
    </button>
</div>

<!-- SHORTCUT FLOATING DENGAN VALIDASI IKON KUSTOM -->
<div id="draggableShortcut" class="fixed bottom-6 right-6">
    <button id="shortcutBtn" class="w-14 h-14 rounded-full bg-gradient-to-tr from-blue-600 via-yellow-500 to-emerald-500 text-white shadow-2xl flex items-center justify-center text-lg font-bold cursor-pointer border-2 border-white/20 active:scale-95 transition">
        <i class="fa-solid fa-circle-nodes"></i>
    </button>
</div>

<!-- SIDEBAR MODAL -->
<aside id="menuSidebar" class="slide-sidebar flex flex-col justify-between">
    <div>
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 text-white flex justify-between items-center shadow-md pt-6">
            <span class="font-bold tracking-wider text-sm"><i class="fa-solid fa-shield-halved mr-2"></i>NEXUS PANEL</span>
            <button onclick="toggleSidebar()" class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center font-bold text-sm text-white hover:bg-white/30 !p-0">✕</button>
        </div>
        
        <nav class="p-4 space-y-1.5">
            <button id="btn-beranda" onclick="switchMenu('beranda')" class="sidebar-active">
                <i class="fa-solid fa-chart-pie w-5 text-center"></i> Overview Dashboard
            </button>
            <button id="btn-ggscript" onclick="switchMenu('ggscript')">
                <i class="fa-solid fa-code w-5 text-center"></i> GG Script Cloud
            </button>
            <button id="btn-keysystem" onclick="switchMenu('keysystem')">
                <i class="fa-solid fa-key w-5 text-center"></i> Key & User Access
            </button>
        </nav>
    </div>
    
    <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
        <div class="bg-slate-100 p-3 rounded-xl border border-slate-200">
            <div class="flex justify-between text-[10px] font-bold text-slate-500 mb-1">
                <span><i class="fa-solid fa-database mr-1 text-slate-400"></i> VERCEL STORAGE</span>
                <span id="storagePercent" class="text-blue-600">0%</span>
            </div>
            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden mb-1">
                <div id="storageBar" class="bg-blue-600 h-full w-0 transition-all duration-500"></div>
            </div>
            <div class="text-[9px] text-slate-400 mono text-right" id="storageUsageText">0 KB / 32 MB</div>
        </div>

        <div class="flex flex-col gap-1">
            <span class="text-[10px] text-slate-400 mono truncate" id="adminEmail">root@nexus.io</span>
            <button onclick="doLogout()" class="!bg-red-50 !text-red-600 text-xs font-bold text-center justify-center py-2 rounded-xl">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Disconnect Account
            </button>
        </div>
    </div>
</aside>

<div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden z-[9998]"></div>

<!-- AUTHENTICATION LAYERS -->
<div id="authGate" class="fixed inset-0 z-[100] bg-[#070913] flex items-center justify-center">
    <div class="w-full max-w-sm mx-4">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/5 border border-white/10 mb-2"><span class="text-lg font-black text-white">NX</span></div>
            <h1 class="text-md font-bold text-white tracking-wider">SECURE DATABASE CONSOLE</h1>
        </div>
        <div class="flex mb-4 gap-1 bg-black/40 p-1 rounded-xl border border-white/5">
            <button id="tabReg" onclick="switchTab('reg')" class="flex-1 py-2 rounded-lg text-xs font-semibold bg-white/10 text-white cursor-pointer">Register</button>
            <button id="tabLog" onclick="switchTab('log')" class="flex-1 py-2 rounded-lg text-xs font-semibold text-slate-400 cursor-pointer">Login</button>
        </div>
        <div id="formReg" class="glass rounded-2xl p-5 space-y-3">
            <input type="email" id="regEmail" placeholder="Email Address" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs mono">
            <input type="password" id="regPass" placeholder="Password (min 4)" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs mono">
            <button onclick="doRegister()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs">Create Admin Account</button>
        </div>
        <div id="formCode" class="glass rounded-2xl p-5 space-y-4 hidden text-center">
            <h3 class="text-xs font-bold text-white">Generated Token</h3>
            <div class="p-4 bg-black/60 rounded-xl tracking-widest font-black text-emerald-400 mono" id="codeDisplay">------</div>
            <button onclick="goLogin()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold">Proceed</button>
        </div>
        <div id="formLog" class="glass rounded-2xl p-5 space-y-3 hidden">
            <input type="email" id="logEmail" placeholder="Email Address" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs mono">
            <input type="password" id="logPass" placeholder="Secret Token / Password" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs mono">
            <button onclick="doLogin()" class="w-full py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold">Authorize Engine</button>
        </div>
    </div>
</div>

<!-- WORKSPACE UTAMA CONTAINER -->
<div id="mainApp" class="hidden min-h-screen pt-20 px-6 pb-6">
    <main class="max-w-4xl mx-auto space-y-6">
        
        <div id="view-beranda" class="space-y-4">
            <div class="glass rounded-2xl p-5">
                <h3 class="text-xs font-bold text-blue-400 mb-2"><i class="fa-solid fa-terminal mr-1"></i> Game Guardian Client Core Manual Hook</h3>
                <textarea id="bootstrapCode" rows="6" readonly class="w-full px-3 py-2 rounded-xl bg-black/40 border border-white/5 text-[10px] text-emerald-400 mono resize-none focus:outline-none"></textarea>
                <button onclick="navigator.clipboard.writeText(document.getElementById('bootstrapCode').value);showToast('Bootstrap Copied!')" class="w-full mt-2 py-2.5 bg-blue-600 text-white text-xs font-bold rounded-xl cursor-pointer">Copy Prompt Initializer</button>
            </div>
        </div>

        <div id="view-ggscript" class="space-y-4 hidden">
            <div class="glass rounded-2xl p-5 space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-white" id="editorTitle">Upload Lua Component</h3>
                    <button onclick="resetEditor()" id="btnResetEdit" class="hidden text-xs text-amber-500 underline">Reset</button>
                </div>
                
                <div class="group relative flex flex-col items-center justify-center border-2 border-dashed border-white/10 hover:border-blue-500/50 rounded-2xl p-4 transition text-center bg-black/20">
                    <span class="text-xs text-slate-400 mb-1"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Pilih File Script (.lua/.txt)</span>
                    <input type="file" id="fileSelector" accept=".lua,.txt" onchange="handleFileSelect(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                    <span id="selectedFileNameDisplay" class="text-[10px] text-blue-400 mono font-bold truncate max-w-xs">Belum ada file dipilih</span>
                </div>

                <input type="hidden" id="editScriptId">
                <input type="text" id="fileName" placeholder="filename.lua" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs mono">
                <textarea id="fileContent" rows="8" placeholder="-- Isi script text otomatis terisi saat file dipilih..." class="w-full px-4 py-3 rounded-xl input-dark text-xs mono resize-none"></textarea>
                
                <div id="uploadProgressContainer" class="hidden space-y-1">
                    <div class="flex justify-between text-[9px] text-slate-400 font-bold tracking-wider">
                        <span>UPLOADING TO POSTGRES STORAGE...</span>
                        <span id="uploadProgressPercent">0%</span>
                    </div>
                    <div class="w-full bg-black/40 h-1.5 rounded-full overflow-hidden">
                        <div id="uploadProgressBar" class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-0 transition-all duration-100"></div>
                    </div>
                </div>

                <button id="deployBtn" onclick="deployFile()" class="w-full py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl cursor-pointer">Commit Database</button>
            </div>
            <div id="fileList" class="space-y-2"></div>
        </div>

        <div id="view-keysystem" class="space-y-4 hidden">
            <div class="glass rounded-2xl p-5 space-y-4">
                <h3 class="text-xs font-bold text-white">Generate Member Key Modules</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <select id="keyTarget" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs mono"></select>
                    </div>
                    <div>
                        <input type="number" id="keyMaxDevices" value="1" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs mono" placeholder="Limit Perangkat">
                    </div>
                    <div>
                        <input type="datetime-local" id="keyExp" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs mono">
                    </div>
                    <div>
                        <input type="text" id="keyCustom" placeholder="Custom Key Name (Optional)" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs mono">
                    </div>
                </div>
                <button onclick="genKey()" class="w-full py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl">Create Secure Access Key</button>
            </div>
            <div id="keyList" class="space-y-2"></div>
        </div>
    </main>
</div>

<div id="toast" class="fixed bottom-6 left-6 bg-blue-600 text-white px-4 py-2.5 rounded-xl shadow-2xl opacity-0 transition-all duration-300 z-[99999] text-xs font-bold">✨ <span id="toastMsg"></span></div>

<script>
var S = { files: [], keys: [], session: '', currentMenu: 'beranda' };

function showToast(m) {
    var t = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = m;
    t.style.opacity = '1';
    setTimeout(function() { t.style.opacity = '0'; }, 2500);
}

function toggleSidebar() {
    var s = document.getElementById('menuSidebar');
    var o = document.getElementById('sidebarOverlay');
    s.classList.toggle('open');
    o.classList.toggle('hidden');
    if (s.classList.contains('open')) updateStorageMetric();
}

async function updateStorageMetric() {
    var r = await api('GET', '?type=storage');
    if (!r.ok) return;
    var d = await r.json();
    var pct = Math.min(Math.round((d.usedBytes / d.allocatedBytes) * 100), 100);
    
    document.getElementById('storageBar').style.width = pct + '%';
    document.getElementById('storagePercent').innerText = pct + '%';
    
    var usedKB = (d.usedBytes / 1024).toFixed(1);
    var maxMB = (d.allocatedBytes / (1024 * 1024)).toFixed(0);
    document.getElementById('storageUsageText').innerText = usedKB + ' KB / ' + maxMB + ' MB';
}

function handleFileSelect(e) {
    var file = e.target.files[0];
    if (!file) return;
    document.getElementById('selectedFileNameDisplay').innerText = file.name;
    document.getElementById('fileName').value = file.name;
    
    var reader = new FileReader();
    reader.onload = function(evt) {
        document.getElementById('fileContent').value = evt.target.result;
    };
    reader.readAsText(file);
}

function switchMenu(t) {
    S.currentMenu = t;
    ['beranda', 'ggscript', 'keysystem'].forEach(function(m) {
        document.getElementById('view-' + m).classList.add('hidden');
        document.getElementById('btn-' + m).classList.remove('sidebar-active');
    });
    document.getElementById('view-' + t).classList.remove('hidden');
    document.getElementById('btn-' + t).classList.add('sidebar-active');
    
    var s = document.getElementById('menuSidebar');
    if (s.classList.contains('open')) toggleSidebar();

    if (t === 'beranda') initBeranda();
    if (t === 'ggscript') loadFiles();
    if (t === 'keysystem') { loadFiles(); loadKeys(); }
}

function initBeranda() {
    var code = `local ask = gg.prompt({"🔑 INPUT KEY LISENSI MEMBER:"}, {nil}, {"text"})\n`;
    code += `if not ask then os.exit() end\n`;
    code += `local userKey = ask[1]\n`;
    code += `if userKey == "" then gg.alert("Key Kosong!") os.exit() end\n`;
    code += `local targetUrl = "` + location.origin + `/api/server?key=" .. userKey\n`;
    code += `local r = gg.makeRequest(targetUrl)\n`;
    code += `if r and r.code == 200 then\n`;
    code += `    local run = load(r.content)\n`;
    code += `    if run then run() else gg.alert("Lisensi Salah!") end\n`;
    code += `else\n`;
    code += `    gg.alert("Jaringan Error!")\n`;
    code += `end`;
    document.getElementById('bootstrapCode').value = code;
}

async function api(method, urlParams, bodyContent) {
    var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
    if (S.session) opts.headers['X-Session'] = S.session;
    if (bodyContent) opts.body = JSON.stringify(bodyContent);
    return fetch('/api/server' + urlParams, opts);
}

async function loadFiles() {
    var r = await api('GET', '');
    if (!r.ok) return;
    S.files = await r.json();
    var sel = document.getElementById('keyTarget');
    if (sel) sel.innerHTML = S.files.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
    
    var c = document.getElementById('fileList');
    c.innerHTML = S.files.map(f => {
        var plainRawLink = location.origin + '/api/server?type=raw&id=' + f.id;
        return `
        <div class="glass rounded-xl p-4 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
            <div>
                <span class="mono text-xs font-bold text-blue-400"><i class="fa-regular fa-file-code mr-1"></i> ${f.name}</span>
            </div>
            <div class="flex gap-1.5">
                <button onclick="navigator.clipboard.writeText('${plainRawLink}');showToast('Link Script Copied!')" class="px-2.5 py-1 bg-white/5 text-white border border-white/10 rounded-lg text-[10px] cursor-pointer">Copy Link</button>
                <button onclick="editFile('${f.id}','${btoa(encodeURIComponent(f.content))}')" class="px-2.5 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-lg text-[10px] cursor-pointer">Edit</button>
                <button onclick="delFile('${f.id}')" class="px-2.5 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-[10px] cursor-pointer">Delete</button>
            </div>
        </div>`;
    }).join('');
}

function editFile(id, base64Content) {
    var dec = decodeURIComponent(atob(base64Content));
    var target = S.files.find(f => f.id === id);
    if (!target) return;
    document.getElementById('editScriptId').value = id;
    document.getElementById('fileName').value = target.name;
    document.getElementById('fileContent').value = dec;
    document.getElementById('editorTitle').innerText = 'Editing Script: ' + target.name;
    document.getElementById('btnResetEdit').classList.remove('hidden');
    switchMenu('ggscript');
}

function resetEditor() {
    document.getElementById('editScriptId').value = '';
    document.getElementById('fileName').value = '';
    document.getElementById('fileContent').value = '';
    document.getElementById('fileSelector').value = '';
    document.getElementById('selectedFileNameDisplay').innerText = 'Belum ada file dipilih';
    document.getElementById('editorTitle').innerText = 'Upload Lua Component';
    document.getElementById('btnResetEdit').classList.add('hidden');
}

async function deployFile() {
    var n = document.getElementById('fileName').value.trim();
    var c = document.getElementById('fileContent').value;
    var existingId = document.getElementById('editScriptId').value;
    if (!n || !c) return showToast('Form Input Kosong!');
    
    var pBox = document.getElementById('uploadProgressContainer');
    var pBar = document.getElementById('uploadProgressBar');
    var pPct = document.getElementById('uploadProgressPercent');
    
    pBox.classList.remove('hidden');
    
    let progress = 0;
    let interval = setInterval(async () => {
        progress += 15;
        if (progress > 90) progress = 90;
        pBar.style.width = progress + '%';
        pPct.innerText = progress + '%';
    }, 80);

    var r = await api('POST', '', { name: n, content: c, existingScriptId: existingId });
    
    clearInterval(interval);
    pBar.style.width = '100%';
    pPct.innerText = '100%';
    
    setTimeout(() => {
        pBox.classList.add('hidden');
        pBar.style.width = '0%';
        pPct.innerText = '0%';
        if (r.ok) { showToast('Script Committed!'); resetEditor(); loadFiles(); }
    }, 400);
}

function copyHookCode(rawTargetUrl) {
    var rawText = 'local A = gg.getFile() gg.getFile = function() return A end local V = gg.makeRequest("' + rawTargetUrl + '").content if V then pcall(load(V)) end';
    navigator.clipboard.writeText(rawText);
    showToast('Secure Loader Copied!');
}

async function loadKeys() {
    var r = await api('GET', '?type=keys');
    if (!r.ok) return;
    S.keys = await r.json();
    var c = document.getElementById('keyList');
    c.innerHTML = S.keys.map(k => {
        var expDate = new Date(k.expiry);
        var isExpired = new Date() > expDate;
        var devicesCount = k.registered_devices ? k.registered_devices.length : 0;
        var targetUrl = location.origin + '/api/server?key=' + k.key;
        
        return `
            <div class="glass rounded-xl p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <span class="mono text-xs font-bold ${isExpired ? 'text-red-400 line-through' : 'text-amber-400'}"><i class="fa-solid fa-key text-[10px] mr-1"></i> ${k.key}</span>
                    <button onclick="delKey('${k.key}')" class="text-[10px] text-red-400 bg-red-500/10 border border-red-500/20 px-2 py-0.5 rounded-md">Delete</button>
                </div>
                <div class="flex flex-wrap justify-between text-[10px] text-slate-400 mono gap-2 pt-1 border-t border-white/5">
                    <div>Module: <span class="text-white">${k.target_script_name}</span></div>
                    <div>Devices: <span class="text-emerald-400">${devicesCount}/${k.max_devices}</span></div>
                    <div>Expired: <span class="text-slate-300">${expDate.toLocaleDateString()}</span></div>
                </div>
                <button onclick="copyHookCode('${targetUrl}')" class="w-full py-2 bg-blue-600/10 text-blue-400 border border-blue-500/20 hover:bg-blue-600/20 text-xs font-bold rounded-xl cursor-pointer block text-center">
                    Copy Hook Load Script
                </button>
            </div>`;
    }).join('');
}

async function genKey() {
    var s = document.getElementById('keyTarget').value;
    var maxDev = document.getElementById('keyMaxDevices').value;
    var e = document.getElementById('keyExp').value;
    var c = document.getElementById('keyCustom').value.trim();
    if (!s || !e) return showToast('Lengkapi parameter!');
    var r = await api('POST', '', { action: 'createKey', scriptId: s, expiry: e, maxDevices: maxDev, customName: c });
    if (r.ok) { showToast('License Created!'); document.getElementById('keyCustom').value = ''; loadKeys(); }
}

async function delFile(id) { if (confirm('Hapus Script?')) { await api('DELETE', '?id=' + id); loadFiles(); } }
async function delKey(k) { if (confirm('Hapus Lisensi?')) { await api('DELETE', '?deleteKey=' + k); loadKeys(); } }

function switchTab(t) {
    if (t === 'reg') {
        document.getElementById('formReg').classList.remove('hidden');
        document.getElementById('formLog').classList.add('hidden');
    } else {
        document.getElementById('formLog').classList.remove('hidden');
        document.getElementById('formReg').classList.add('hidden');
    }
}

async function doRegister() {
    var em = document.getElementById('regEmail').value.trim(), p = document.getElementById('regPass').value;
    var r = await fetch('/api/server', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'register', email: em, password: p }) });
    if (r.ok) { var d = await r.json(); document.getElementById('codeDisplay').innerText = d.code; document.getElementById('formReg').classList.add('hidden'); document.getElementById('formCode').classList.remove('hidden'); }
}

async function doLogin() {
    var em = document.getElementById('logEmail').value.trim(), p = document.getElementById('logPass').value;
    var r = await fetch('/api/server', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', email: em, password: p }) });
    if (r.ok) { var d = await r.json(); S.session = d.session; localStorage.setItem('nx_session', d.session); document.getElementById('authGate').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); document.getElementById('adminEmail').innerText = em; switchMenu('beranda'); }
}

function goLogin() { document.getElementById('formCode').classList.add('hidden'); switchTab('log'); }
function doLogout() { localStorage.removeItem('nx_session'); location.reload(); }

// LOGIKA PEMISAH DRAG & CLICK SHORTCUT SECARA TOTAL
var box = document.getElementById('draggableShortcut');
var btn = document.getElementById('shortcutBtn');
var isDragging = false, startX, startY, initialX, initialY;

btn.addEventListener('click', function(e) {
    if (isDragging) { e.preventDefault(); return; }
    toggleSidebar();
});

box.addEventListener('mousedown', dragStart);
box.addEventListener('touchstart', dragStart, { passive: true });
document.addEventListener('mousemove', dragMove);
document.addEventListener('touchmove', dragMove, { passive: false });
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    startX = clientX; startY = clientY;
    var style = window.getComputedStyle(box);
    initialX = parseInt(style.right); initialY = parseInt(style.bottom);
    isDragging = false; 
}

function dragMove(e) {
    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
    var dx = startX - clientX, dy = startY - clientY;
    
    // Toleransi 6 piksel untuk memisahkan pergeseran murni dengan klik tidak sengaja
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) {
        isDragging = true;
        box.style.right = (initialX + dx) + 'px';
        box.style.bottom = (initialY + dy) + 'px';
    }
}

function dragEnd() { 
    setTimeout(() => { isDragging = false; }, 80); 
}

window.onload = function() {
    var cached = localStorage.getItem('nx_session');
    if (cached) { S.session = cached; document.getElementById('authGate').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); switchMenu('beranda'); }
}
</script>
