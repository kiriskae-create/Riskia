<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS X CLOUD</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
        *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        body{font-family:'Plus Jakarta Sans',sans-serif;background:#030407;color:#f1f5f9;overflow-x:hidden;-webkit-font-smoothing:antialiased}
        .mono{font-family:'JetBrains Mono',monospace}
        .glass{background:rgba(9,11,18,0.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,0.03);transform:translateZ(0)}
        .sidebar-panel{background:#07080d;border-right:1px solid rgba(255,255,255,0.03);transition:transform .3s cubic-bezier(.16,1,.3,1);will-change:transform;transform:translateZ(0)}
        .menu-active{background:rgba(255,255,255,0.05)!important;color:#fff!important;font-weight:700;border-right:3px solid #f59e0b}
        .btn-premium{background:#fff;color:#000;font-weight:700;transition:background .2s,transform .1s;cursor:pointer}
        .btn-premium:active{transform:scale(.97)}
        .btn-premium:disabled{background:#555;color:#999;cursor:not-allowed;transform:none}
        .input-premium{background:rgba(15,18,28,0.8);border:1px solid rgba(255,255,255,0.05);color:#fff}
        .input-premium:focus{outline:none;border-color:#f59e0b}
        .storage-bar{background:linear-gradient(90deg,#f59e0b,#d97706);transition:width .4s cubic-bezier(.1,.8,.2,1)}
        .modal-blur{backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:all .25s ease-out}
        input[type="datetime-local"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}
        .shake{animation:shake .4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row">

<!-- AUTH GATE -->
<div id="authGate" class="fixed inset-0 z-[200] bg-[#030407] flex items-center justify-center">
    <div class="w-full max-w-sm mx-4">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-white/5 border border-white/10 mb-4">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1 class="text-2xl font-extrabold tracking-tighter text-white">NEXUS CORE</h1>
            <p class="text-[10px] text-slate-500 tracking-widest mt-1.5 uppercase">SECURE TERMINAL</p>
        </div>
        <div class="glass rounded-2xl p-6 space-y-4">
            <input type="text" id="admUser" placeholder="Username" class="w-full px-4 py-3 rounded-xl input-premium text-sm mono">
            <input type="password" id="admPass" placeholder="PIN" class="w-full px-4 py-3 rounded-xl input-premium text-sm mono">
            <button onclick="doLogin()" class="w-full py-3 rounded-xl btn-premium text-sm">Authenticate</button>
        </div>
    </div>
</div>

<!-- SIDEBAR -->
<aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 sidebar-panel flex flex-col justify-between p-5 transform -translate-x-full md:translate-x-0 md:sticky h-screen shrink-0">
    <div class="space-y-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-white font-black text-sm">NX</div>
                <div>
                    <h2 class="text-xs font-bold text-white tracking-wider uppercase">Nexus Core</h2>
                    <span class="text-[9px] text-emerald-400 mono font-semibold tracking-widest">ONLINE v3.0</span>
                </div>
            </div>
            <button onclick="toggleSB(false)" class="md:hidden text-slate-400 p-1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <nav class="space-y-1">
            <button id="btn-beranda" onclick="sw('beranda')" class="w-full text-left px-4 py-3 rounded-xl text-xs font-medium flex items-center gap-3.5 text-slate-400 hover:bg-white/5 cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Overview
            </button>
            <button id="btn-ggscript" onclick="sw('ggscript')" class="w-full text-left px-4 py-3 rounded-xl text-xs font-medium flex items-center gap-3.5 text-slate-400 hover:bg-white/5 cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                Cloud Scripts
            </button>
            <button id="btn-keysystem" onclick="sw('keysystem')" class="w-full text-left px-4 py-3 rounded-xl text-xs font-medium flex items-center gap-3.5 text-slate-400 hover:bg-white/5 cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6m3.1-6.1 4.2 4.2M16 4l3 3"/></svg>
                License Keys
            </button>
        </nav>
    </div>
    <div class="space-y-4 border-t border-white/5 pt-4">
        <div class="space-y-1.5">
            <div class="flex justify-between text-[10px] mono text-slate-400"><span>Storage</span><span id="storagePct">0%</span></div>
            <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden"><div id="storageBar" class="h-full storage-bar w-0"></div></div>
        </div>
        <div class="flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5">
            <div class="min-w-0"><p class="text-xs font-bold text-white truncate">Riski</p><p class="text-[9px] text-slate-500 mono tracking-wider">Root Admin</p></div>
            <button onclick="doLogout()" class="p-1.5 bg-red-500/10 text-red-400 rounded-lg border border-red-500/20 cursor-pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
    </div>
</aside>

<div id="sbOverlay" onclick="toggleSB(false)" class="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm hidden md:hidden"></div>

<!-- MOBILE HEADER -->
<div class="md:hidden bg-[#07080d] border-b border-white/5 px-4 py-3 flex items-center justify-between sticky top-0 z-40 w-full shrink-0">
    <button onclick="toggleSB(true)" class="p-2 bg-white/5 rounded-lg text-white"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <div class="text-xs font-bold tracking-widest text-white uppercase">NEXUS CORE</div>
    <div class="w-7 h-7 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-[10px] font-bold">R</div>
</div>

<!-- MAIN CONTENT -->
<main id="mainArea" class="flex-1 p-4 md:p-8 overflow-y-auto w-full">

    <!-- BERANDA -->
    <div id="view-beranda" class="space-y-6">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            Overview
        </h2>
        <div class="glass rounded-2xl p-5">
            <div class="p-3 bg-white/5 border border-white/5 rounded-xl space-y-1.5">
                <span class="text-xs font-semibold text-slate-300">Gateway URL</span>
                <div class="flex gap-2 items-center">
                    <code class="text-[10px] text-amber-400 mono bg-black/40 px-2.5 py-1.5 rounded-lg truncate flex-1" id="gwUrl">-</code>
                    <button onclick="cpText(document.getElementById('gwUrl').innerText)" class="px-3 py-1.5 bg-white text-black font-bold text-[10px] rounded-lg cursor-pointer shrink-0">COPY</button>
                </div>
            </div>
        </div>
    </div>

    <!-- GG SCRIPT -->
    <div id="view-ggscript" class="space-y-6 hidden">
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/></svg>
                Cloud Scripts
            </h2>
            <button onclick="uploadLua()" class="px-3 py-2 bg-white/5 border border-white/10 text-white text-xs font-bold rounded-xl flex items-center gap-2 cursor-pointer">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                Upload .lua
            </button>
        </div>
        <div class="glass rounded-2xl p-5 space-y-4">
            <h3 class="text-xs font-bold text-white">Deploy Script</h3>
            <input type="text" id="fN" placeholder="filename.lua" class="w-full px-4 py-2.5 rounded-xl input-premium text-xs mono">
            <textarea id="fC" rows="6" placeholder="-- lua payload..." class="w-full px-4 py-3 rounded-xl input-premium text-xs mono resize-none"></textarea>
            <button onclick="deployScript()" class="w-full py-2.5 rounded-xl btn-premium text-xs">Publish</button>
        </div>
        <div id="fList" class="space-y-3"></div>
    </div>

    <!-- KEY SYSTEM -->
    <div id="view-keysystem" class="space-y-6 hidden">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6m3.1-6.1 4.2 4.2M16 4l3 3"/></svg>
            License Keys
        </h2>

        <div class="glass rounded-2xl p-5 space-y-4">
            <h3 class="text-xs font-bold text-white">Generate Key</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Target Script</label>
                    <select id="kT" class="w-full px-3 py-2.5 rounded-xl input-premium text-xs mono"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Max Devices</label>
                    <input type="number" id="kM" value="1" min="1" class="w-full px-3 py-2.5 rounded-xl input-premium text-xs mono">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Duration</label>
                    <select id="kPreset" onchange="onPresetChange(this.value)" class="w-full px-3 py-2.5 rounded-xl input-premium text-xs mono">
                        <option value="1">1 Hari</option>
                        <option value="3">3 Hari</option>
                        <option value="7">7 Hari</option>
                        <option value="30">30 Hari</option>
                        <option value="PERMANENT">PERMANENT (Unlimited)</option>
                        <option value="CUSTOM">Custom Date</option>
                    </select>
                </div>
                <div id="dateZone" class="hidden">
                    <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase">Pilih Tanggal</label>
                    <input type="datetime-local" id="kE" class="w-full px-3 py-2.5 rounded-xl input-premium text-xs mono">
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 mb-1 uppercase" id="kCLabel">Custom License Name <span class="text-slate-600 font-normal">(opsional)</span></label>
                <input type="text" id="kC" placeholder="e.g. RISKI-VIP-001" class="w-full px-4 py-2.5 rounded-xl input-premium text-xs mono">
            </div>
            <button id="genBtn" onclick="genKey()" class="w-full py-2.5 rounded-xl btn-premium text-xs">Generate Key</button>
        </div>
        <div id="kList" class="space-y-3"></div>
    </div>
</main>

<!-- EDIT MODAL -->
<div id="editModal" class="fixed inset-0 z-[150] items-center justify-center p-4 bg-black/75 modal-blur hidden opacity-0">
    <div class="glass w-full max-w-2xl rounded-2xl p-5 space-y-4 shadow-2xl scale-95 transition-all duration-200" id="editBox">
        <div class="flex justify-between items-center border-b border-white/5 pb-2">
            <h3 class="text-xs font-bold text-white">Edit Source</h3>
            <button onclick="closeEdit()" class="w-6 h-6 rounded-full bg-white/5 flex items-center justify-center text-xs text-slate-400 cursor-pointer">✕</button>
        </div>
        <input type="hidden" id="editId">
        <input type="text" id="editName" class="w-full px-4 py-2.5 rounded-xl input-premium text-xs mono">
        <textarea id="editContent" rows="10" class="w-full px-4 py-3 rounded-xl input-premium text-xs mono resize-none"></textarea>
        <div class="flex gap-2 justify-end pt-2">
            <button onclick="closeEdit()" class="px-5 py-2.5 bg-white/5 text-white border border-white/5 rounded-xl text-xs font-bold cursor-pointer">Batal</button>
            <button onclick="saveEdit()" class="px-5 py-2.5 bg-amber-500 text-black rounded-xl text-xs font-bold cursor-pointer">Update</button>
        </div>
    </div>
</div>

<!-- CONFIRM MODAL -->
<div id="cfmModal" class="fixed inset-0 z-[160] items-center justify-center p-4 bg-black/80 modal-blur hidden opacity-0">
    <div class="glass w-full max-w-sm rounded-2xl p-6 space-y-5 shadow-2xl scale-95 transition-all duration-200" id="cfmBox">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-full bg-red-500/10 text-red-500 border border-red-500/20 flex items-center justify-center mx-auto">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <h3 class="text-sm font-bold text-white">Hapus Data?</h3>
            <p class="text-xs text-slate-400">Data akan dihapus permanen.</p>
        </div>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="closeCfm()" class="py-2.5 bg-white/5 border border-white/5 text-white rounded-xl text-xs font-bold cursor-pointer">Batal</button>
            <button id="cfmBtn" class="py-2.5 bg-red-600 text-white rounded-xl text-xs font-bold cursor-pointer">Hapus</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 md:left-auto md:translate-x-0 md:right-6 bg-white text-black px-4 py-3 rounded-xl shadow-2xl opacity-0 transition-opacity duration-200 z-[250] text-xs font-bold max-w-[90vw] text-center">
    <span id="tMsg"></span>
</div>

<script>
var S = { files:[], keys:[], session:'', cur:'beranda' };

function toast(m){var t=document.getElementById('toast');document.getElementById('tMsg').innerText=m;t.style.opacity='1';setTimeout(function(){t.style.opacity='0'},2800)}

function cpText(t,msg){
    msg=msg||'Copied!';
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast(msg)}).catch(function(){fallbackCopy(t,msg)})}
    else{fallbackCopy(t,msg)}
}
function fallbackCopy(t,msg){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast(msg)}

function toggleSB(open){var s=document.getElementById('sidebar'),o=document.getElementById('sbOverlay');if(open){s.classList.remove('-translate-x-full');o.classList.remove('hidden')}else{s.classList.add('-translate-x-full');o.classList.add('hidden')}}

function sw(t){
    S.cur=t;
    ['beranda','ggscript','keysystem'].forEach(function(m){
        var v=document.getElementById('view-'+m);if(v)v.classList.add('hidden');
        var b=document.getElementById('btn-'+m);if(b)b.classList.remove('menu-active');
    });
    var v=document.getElementById('view-'+t);if(v)v.classList.remove('hidden');
    var b=document.getElementById('btn-'+t);if(b)b.classList.add('menu-active');
    toggleSB(false);
    if(t==='beranda')document.getElementById('gwUrl').innerText=location.origin+'/api/server?type=login';
    if(t==='ggscript')loadScripts();
    if(t==='keysystem'){loadScripts();loadKeys()}
    updStorage();
}

function updStorage(){var p=Math.min(Math.round(((S.files.length+S.keys.length)/50)*100),100);document.getElementById('storagePct').innerText=p+'%';document.getElementById('storageBar').style.width=p+'%'}

async function api(method,url,body){
    var o={method:method,headers:{'Content-Type':'application/json'}};
    if(S.session)o.headers['X-Session']=S.session;
    if(body)o.body=JSON.stringify(body);
    var resp;
    try{resp=await fetch('/api/server'+url,o)}catch(e){return{ok:false,status:0,json:async function(){return{error:'Network error'}}}}
    return resp;
}

async function doLogin(){
    var u=document.getElementById('admUser').value.trim(),p=document.getElementById('admPass').value;
    try{
        var r=await fetch('/api/server',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:u,password:p})});
        if(r.ok){var d=await r.json();S.session=d.session;localStorage.setItem('nx_sess',d.session);document.getElementById('authGate').classList.add('hidden');sw('beranda')}
        else{toast('ACCESS DENIED!')}
    }catch(e){toast('Connection error!')}
}
function doLogout(){localStorage.removeItem('nx_sess');location.reload()}

function uploadLua(){var i=document.createElement('input');i.type='file';i.accept='.lua';i.onchange=function(e){var f=e.target.files[0],r=new FileReader();r.readAsText(f,'UTF-8');r.onload=function(ev){document.getElementById('fN').value=f.name;document.getElementById('fC').value=ev.target.result;toast('Loaded: '+f.name)}};i.click()}

function copyHook(sid){cpText('local A=gg.getFile() gg.getFile=function()return A end local V=gg.makeRequest("'+location.origin+'/api/server?type=menu&id='+sid+'").content if V then pcall(load(V)) end','Hook Copied!')}
function copyLoader(sid){cpText('local A=gg.getFile() gg.getFile=function()return A end local V=gg.makeRequest("'+location.origin+'/api/server?type=login&id='+sid+'").content if V then pcall(load(V)) end','Loader Copied!')}

async function loadScripts(){
    try{
        var r=await api('GET','');if(!r.ok)return;
        S.files=await r.json();
        var s=document.getElementById('kT');
        if(s)s.innerHTML=S.files.map(function(f){return'<option value="'+f.id+'">'+f.name+'</option>'}).join('');
        var c=document.getElementById('fList');if(!c)return;
        c.innerHTML=S.files.map(function(f){
            return'<div class="glass rounded-xl p-4 space-y-3 border border-white/5"><div class="flex justify-between items-center"><div><span class="mono text-xs font-bold text-white block">'+f.name+'</span><span class="text-[9px] text-slate-500 mono block mt-0.5">'+f.id+'</span></div><div class="flex gap-2"><button onclick="openEdit(\''+f.id+'\')" class="p-2 bg-white/5 text-blue-400 rounded-lg border border-white/5 cursor-pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button onclick="openCfm(\'script\',\''+f.id+'\')" class="p-2 bg-white/5 text-red-400 rounded-lg border border-white/5 cursor-pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div></div><button onclick="copyHook(\''+f.id+'\')" class="w-full py-2.5 bg-white text-black rounded-xl text-[10px] font-bold cursor-pointer">Copy Hook Script</button></div>'
        }).join('');
        updStorage();
    }catch(e){toast('Error load scripts: '+e.message)}
}

function openEdit(id){var t=S.files.find(function(f){return f.id===id});if(!t)return;document.getElementById('editId').value=id;document.getElementById('editName').value=t.name;document.getElementById('editContent').value=t.content;var m=document.getElementById('editModal');m.classList.remove('hidden');m.classList.add('flex');setTimeout(function(){m.classList.remove('opacity-0');document.getElementById('editBox').classList.remove('scale-95')},50)}
function closeEdit(){var m=document.getElementById('editModal');m.classList.add('opacity-0');document.getElementById('editBox').classList.add('scale-95');setTimeout(function(){m.classList.add('hidden');m.classList.remove('flex')},200)}
async function saveEdit(){var id=document.getElementById('editId').value,n=document.getElementById('editName').value.trim(),c=document.getElementById('editContent').value;var r=await api('POST','',{name:n,content:c,existingScriptId:id});if(r.ok){toast('Updated!');closeEdit();loadScripts()}else{try{var e=await r.json();toast(e.error||'Failed')}catch(x){toast('Update failed')}}}
async function deployScript(){var n=document.getElementById('fN').value.trim(),c=document.getElementById('fC').value;if(!n||!c)return toast('Fields empty!');var r=await api('POST','',{name:n,content:c});if(r.ok){toast('Published!');document.getElementById('fN').value='';document.getElementById('fC').value='';loadScripts()}else{toast('Deploy failed')}}

function onPresetChange(val){
    var dz=document.getElementById('dateZone');
    if(dz)dz.classList.toggle('hidden',val!=='CUSTOM');

    var lbl=document.getElementById('kCLabel');
    if(!lbl)return;
    if(val==='PERMANENT'){
        lbl.innerHTML='Custom License Name <span class="text-red-400 font-bold">* WAJIB</span>';
    }else{
        lbl.innerHTML='Custom License Name <span class="text-slate-600 font-normal">(opsional)</span>';
    }

    if(val==='CUSTOM'){
        var t=new Date();t.setDate(t.getDate()+1);t.setHours(23,59,0,0);
        var iso=t.toISOString().slice(0,16);
        var el=document.getElementById('kE');
        if(el){el.min=iso;el.value=iso}
    }
}

async function genKey(){
    var btn=document.getElementById('genBtn');
    btn.disabled=true;btn.innerText='Processing...';

    try{
        var scriptId=document.getElementById('kT').value;
        var maxDev=document.getElementById('kM').value;
        var preset=document.getElementById('kPreset').value;
        var customName=document.getElementById('kC').value.trim();
        var finalExpiry='';

        // PERMANENT PATH
        if(preset==='PERMANENT'){
            if(!customName){
                toast('PERMANENT key WAJIB isi Custom License Name!');
                var inp=document.getElementById('kC');
                inp.style.borderColor='#ef4444';
                inp.classList.add('shake');
                setTimeout(function(){inp.style.borderColor='';inp.classList.remove('shake')},800);
                btn.disabled=false;btn.innerText='Generate Key';
                return;
            }
            if(/[^a-zA-Z0-9\-_]/.test(customName)){
                toast('Nama key hanya boleh: huruf, angka, -, _');
                btn.disabled=false;btn.innerText='Generate Key';
                return;
            }
            finalExpiry='PERMANENT';
        }
        // CUSTOM DATE PATH
        else if(preset==='CUSTOM'){
            var raw=document.getElementById('kE').value;
            if(!raw){
                toast('Pilih tanggal dulu!');
                btn.disabled=false;btn.innerText='Generate Key';
                return;
            }
            var picked=new Date(raw);
            if(picked<=new Date()){
                toast('Tanggal harus lebih dari sekarang!');
                btn.disabled=false;btn.innerText='Generate Key';
                return;
            }
            finalExpiry=picked.toISOString();
        }
        // PRESET DAYS PATH
        else{
            var d=new Date();d.setDate(d.getDate()+parseInt(preset));d.setHours(23,59,59,999);
            finalExpiry=d.toISOString();
        }

        // Kirim ke server
        var r=await api('POST','',{
            action:'createKey',
            scriptId:scriptId,
            expiry:finalExpiry,
            maxDevices:maxDev,
            customName:customName
        });

        if(r.ok){
            var d=await r.json();
            if(d.key){
                toast('Key dibuat: '+d.key);
                if(preset==='PERMANENT')document.getElementById('kC').value='';
                loadKeys();
            }else{
                toast('Response tidak valid');
            }
        }else{
            var errMsg='Generate gagal';
            try{
                var errData=await r.json();
                errMsg=errData.error||errMsg;
            }catch(ex){}
            toast(errMsg);
        }
    }catch(e){
        toast('Error: '+e.message);
    }

    btn.disabled=false;btn.innerText='Generate Key';
}

async function loadKeys(){
    try{
        var r=await api('GET','?type=keys');if(!r.ok)return;
        S.keys=await r.json();
        var c=document.getElementById('kList');if(!c)return;

        c.innerHTML=S.keys.map(function(k){
            var isPerm=k.expiry==='PERMANENT';
            var expTxt=isPerm?'UNLIMITED':new Date(k.expiry).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
            var isExp=!isPerm&&(new Date()>new Date(k.expiry));
            var badge;
            if(isExp)badge='<span class="px-2 py-0.5 bg-red-500/10 text-red-400 text-[9px] font-bold rounded">EXPIRED</span>';
            else if(isPerm)badge='<span class="px-2 py-0.5 bg-amber-500/10 text-amber-400 text-[9px] font-bold rounded">UNLIMITED</span>';
            else badge='<span class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 text-[9px] font-bold rounded">ACTIVE</span>';

            var dc=(k.registered_devices?k.registered_devices.length:0);
            var dm=k.max_devices;
            var safeKey=k.key.replace(/'/g,"\\'").replace(/"/g,'&quot;');

            return'<div class="glass rounded-xl p-4 space-y-3 border border-white/5">'+
                '<div class="flex justify-between items-start gap-2">'+
                    '<div class="min-w-0 flex-1"><div class="flex items-center gap-2 flex-wrap"><span class="mono text-xs font-bold text-white break-all">'+k.key+'</span>'+badge+'</div></div>'+
                    '<button onclick="openCfm(\'key\',\''+safeKey+'\')" class="p-2 bg-white/5 text-red-400 rounded-lg border border-white/5 cursor-pointer shrink-0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>'+
                '</div>'+
                '<div class="grid grid-cols-3 gap-2 text-[10px] text-slate-400 mono pt-2 border-t border-white/5">'+
                    '<div>Script: <span class="text-white block font-semibold truncate">'+(k.target_script_name||'-')+'</span></div>'+
                    '<div>Device: <span class="'+(dc>=dm?'text-red-400':'text-emerald-400')+' block font-bold">'+dc+'/'+dm+'</span></div>'+
                    '<div>Exp: <span class="'+(isPerm?'text-amber-400':(isExp?'text-red-400':'text-slate-300'))+' block font-medium truncate">'+expTxt+'</span></div>'+
                '</div>'+
                '<div class="grid grid-cols-3 gap-2 pt-1">'+
                    '<button onclick="cpText(\''+safeKey+'\',\'Key Copied!\')" class="py-2.5 bg-white/5 text-white border border-white/5 rounded-xl text-[10px] font-bold cursor-pointer">Copy Key</button>'+
                    '<button onclick="copyLoader(\''+k.script_id+'\')" class="py-2.5 bg-white text-black rounded-xl text-[10px] font-bold cursor-pointer">Loader</button>'+
                    '<button onclick="copyHook(\''+k.script_id+'\')" class="py-2.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-xl text-[10px] font-bold cursor-pointer">Hook</button>'+
                '</div>'+
            '</div>';
        }).join('');
        updStorage();
    }catch(e){toast('Error load keys: '+e.message)}
}

function openCfm(type,target){
    var m=document.getElementById('cfmModal');
    document.getElementById('cfmBtn').onclick=async function(){
        if(type==='script'){await api('DELETE','?id='+target);loadScripts()}
        else{await api('DELETE','?deleteKey='+encodeURIComponent(target));loadKeys()}
        closeCfm();
    };
    m.classList.remove('hidden');m.classList.add('flex');
    setTimeout(function(){m.classList.remove('opacity-0');document.getElementById('cfmBox').classList.remove('scale-95')},50);
}
function closeCfm(){var m=document.getElementById('cfmModal');document.getElementById('cfmBox').classList.add('scale-95');setTimeout(function(){m.classList.add('hidden');m.classList.remove('flex')},200)}

window.onload=function(){
    var s=localStorage.getItem('nx_sess');
    if(s&&s==='NEXUS_RISKI_SECURE_TOKEN'){S.session=s;document.getElementById('authGate').classList.add('hidden');sw('beranda')}
};
