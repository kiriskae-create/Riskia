<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS CONTROLLER</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c0e17; color: #f1f5f9; }
        .glass { background: rgba(20, 24, 41, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .purple-header { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
        .btn-purple { background: linear-gradient(135deg, #6366f1, #8b5cf6); transition: all 0.2s; }
        .btn-purple:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }
        .input-dark { background: #131726; border: 1px solid rgba(255,255,255,0.08); color: #f1f5f9; }
        .input-dark:focus { outline: none; border-color: #8b5cf6; }
        /* Animasi Drawer Samping */
        .sidebar-drawer { transform: translateX(-100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-drawer.open { transform: translateX(0); }
        .blur-overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .blur-overlay.open { opacity: 1; pointer-events: auto; backdrop-filter: blur(6px); }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

<!-- TOP TRACER HEADER FOR SIDEBAR CALLOUT -->
<header class="w-full h-14 bg-[#111422] border-b border-white/5 px-4 flex items-center justify-between fixed top-0 left-0 z-40">
    <div class="flex items-center gap-3">
        <!-- ICON GG TRIGGER -->
        <button onclick="toggleMenu(true)" class="w-10 h-10 rounded-xl bg-purple-600/10 border border-purple-500/20 flex items-center justify-center cursor-pointer shadow-md">
            <span class="text-purple-400 font-black text-sm tracking-tighter">GG</span>
        </button>
        <span class="text-xs font-bold tracking-wide text-slate-300">NEXUS PANEL</span>
    </div>
    <div class="text-[11px] font-bold text-red-400 bg-red-500/10 border border-red-500/20 px-2.5 py-1 rounded-lg">
        Expired: <span id="dashExpCount">0</span>
    </div>
</header>

<!-- BACKDROP BLUR OVERLAY -->
<div id="blurBg" onclick="toggleMenu(false)" class="blur-overlay fixed inset-0 bg-black/40 z-40"></div>

<!-- NAVIGATION DRAWER SIDEBAR (MATCHING THE SCREENSHOT DESIGN) -->
<aside id="sideMenu" class="sidebar-drawer fixed top-0 bottom-0 left-0 w-72 bg-[#171a2b] z-50 flex flex-col justify-between shadow-2xl border-r border-white/5">
    <div>
        <!-- PURPLE GRADIENT TOP HEADER -->
        <div class="purple-header p-5 flex items-center justify-between text-white shadow-inner">
            <div class="flex items-center gap-2">
                <span class="text-base font-extrabold tracking-wider">MENU</span>
            </div>
            <button onclick="toggleMenu(false)" class="w-8 h-8 rounded-full bg-black/10 flex items-center justify-center hover:bg-black/20 cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <!-- NAVIGATION LINKS -->
        <nav class="p-4 space-y-1.5">
            <button onclick="sw('beranda')" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                Início (Beranda)
            </button>
            <button onclick="sw('ggscript')" class="w-full flex items-center justify-between px-4 py-3 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition cursor-pointer">
                <div class="flex items-center gap-4">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    GG Script
                </div>
                <span class="bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full uppercase tracking-tight">NOVO</span>
            </button>
            <button onclick="sw('keysystem')" class="w-full flex items-center gap-4 px-4 py-3 rounded-xl text-xs font-medium text-slate-300 hover:bg-white/5 transition cursor-pointer">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                Gerenciar usuários (Lisensi)
            </button>
        </nav>
    </div>

    <!-- LOWER SIDEBAR EXTRA INFO -->
    <div class="p-4 border-t border-white/5 bg-[#121524]">
        <div class="p-2.5 rounded-xl bg-red-500/5 border border-red-500/10 mb-3 flex justify-between items-center text-[11px]">
            <span class="text-slate-400 font-medium">Expired Terdeteksi:</span>
            <span id="sideExpBadge" class="text-red-400 font-extrabold bg-red-500/10 px-1.5 py-0.5 rounded">0</span>
        </div>
        <p class="text-[10px] text-slate-500 truncate mb-2" id="userEmail">admin@nexus.io</p>
        <button onclick="doLogout()" class="w-full py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold cursor-pointer hover:bg-red-950/20 hover:text-red-400 transition">Logout</button>
    </div>
</aside>

<!-- AUTHENTICATION CONTAINER -->
<div id="authGate" class="fixed inset-0 z-50 bg-[#0c0e17] flex items-center justify-center px-4">
    <div class="w-full max-w-sm glass rounded-2xl p-6 space-y-4">
        <h2 class="text-center text-lg font-bold tracking-tight text-white">NEXUS AUTH SIGNIN</h2>
        <input type="email" id="lE" placeholder="Alamat Gmail" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs">
        <input type="password" id="lP" placeholder="Password" class="w-full px-4 py-2.5 rounded-xl input-dark text-xs">
        <button onclick="doLogin()" class="w-full py-2.5 rounded-xl btn-purple text-xs font-bold text-white">Masuk System</button>
    </div>
</div>

<!-- WORKSPACE BODY -->
<main id="mainApp" class="hidden pt-20 px-4 max-w-3xl mx-auto pb-10 space-y-6">

    <!-- VIEW: OVERVIEW -->
    <div id="view-beranda" class="space-y-4">
        <div class="glass rounded-2xl p-5 space-y-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Gateway Integrasi</h3>
            <div class="space-y-2 text-xs">
                <div>
                    <span class="text-slate-400 block mb-1 font-medium">Loader Script Base URL:</span>
                    <code id="loadUrlCode" class="block p-2 bg-black/30 rounded text-[10px] text-purple-400 mono break-all">-</code>
                </div>
            </div>
        </div>
    </div>

    <!-- VIEW: SCRIPTS ENGINE -->
    <div id="view-ggscript" class="space-y-4 hidden">
        <div class="glass rounded-2xl p-5 space-y-4">
            <h3 class="text-xs font-bold text-white" id="editorTitle">Buat Baru Script Cloud</h3>
            <input type="hidden" id="editScriptId">
            <input type="text" id="scriptName" placeholder="nama_script.lua" class="w-full px-3 py-2 rounded-xl input-dark text-xs">
            <textarea id="scriptContent" rows="8" placeholder="-- Input Lua Code di sini..." class="w-full px-3 py-2 rounded-xl input-dark text-xs mono"></textarea>
            
            <!-- TOGGLE ENCRYPT TOGETHER -->
            <label class="flex items-center gap-2 cursor-pointer bg-black/20 p-2 rounded-xl border border-white/5">
                <input type="checkbox" id="encryptToggle" class="accent-purple-500">
                <span class="text-xs font-semibold text-purple-300">Aktifkan Enkripsi XOR & Anti-Assembly (Otomatis enkrip saat disimpan)</span>
            </label>

            <button onclick="saveScript()" class="w-full py-2.5 rounded-xl btn-purple text-xs font-bold text-white">Simpan & Amankan Script</button>
        </div>
        <div id="scriptContainer" class="space-y-2"></div>
    </div>

    <!-- VIEW: LICENSING CONTROL -->
    <div id="view-keysystem" class="space-y-4 hidden">
        <div class="glass rounded-2xl p-5 space-y-4">
            <h3 class="text-xs font-bold text-white">Generate Lisensi Baru</h3>
            <div class="space-y-3">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Pilih Script Target</label>
                    <select id="keyTarget" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Limit Perangkat (Max Device)</label>
                        <input type="number" id="keyMaxDevices" value="1" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 mb-1">Pilih Masa Aktif (Expired)</label>
                        <select id="keyExpiryPreset" onchange="handleExpiryPreset(this.value)" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs">
                            <option value="1">1 Hari</option>
                            <option value="3">3 Hari</option>
                            <option value="permanent">Permanen</option>
                            <option value="custom">Kustom Tanggal</option>
                        </select>
                    </div>
                </div>
                <div id="customExpiryBox" class="hidden">
                    <label class="block text-[10px] text-slate-400 mb-1">Tentukan Tanggal Kustom</label>
                    <input type="datetime-local" id="keyExpiryCustom" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">Custom Nama Key (Kosongkan jika ingin acak/random)</label>
                    <input type="text" id="keyCustomName" placeholder="Contoh: PREMIUM-USER" class="w-full px-3 py-2.5 rounded-xl input-dark text-xs">
                </div>
            </div>
            <button onclick="generateLicense()" class="w-full py-2.5 rounded-xl btn-purple text-xs font-bold text-white">Buat Lisensi</button>
        </div>
        <div id="licenseContainer" class="space-y-2"></div>
    </div>

</main>

<script>
var state = { files: [], keys: [], token: '' };

function toggleMenu(open) {
    document.getElementById('sideMenu').classList.toggle('open', open);
    document.getElementById('blurBg').classList.toggle('open', open);
}

function handleExpiryPreset(v) {
    document.getElementById('customExpiryBox').classList.toggle('hidden', v !== 'custom');
}

function sw(target) {
    ['beranda', 'ggscript', 'keysystem'].forEach(m => {
        document.getElementById('view-' + m).classList.add('hidden');
    });
    document.getElementById('view-' + target).classList.remove('hidden');
    toggleMenu(false);
    if(target === 'beranda') initDashboard();
    if(target === 'ggscript') { fetchScripts(); }
    if(target === 'keysystem') { fetchScripts(); fetchLicenses(); }
}

function initDashboard() {
    document.getElementById('loadUrlCode').innerText = location.origin + '/api/server?type=loader';
    updateExpiredCount();
}

async function apiCall(method, query, body) {
    let headers = { 'Content-Type': 'application/json' };
    if (state.token) headers['X-Session'] = state.token;
    return fetch('/api/server' + query, { method, headers, body: body ? JSON.stringify(body) : null });
}

async function updateExpiredCount() {
    let res = await apiCall('GET', '?type=keys');
    if (res.ok) {
        let list = await res.json();
        let exp = list.filter(k => k.expiry && new Date() > new Date(k.expiry)).length;
        document.getElementById('dashExpCount').innerText = exp;
        document.getElementById('sideExpBadge').innerText = exp;
    }
}

async function fetchScripts() {
    let res = await apiCall('GET', '');
    if (!res.ok) return;
    state.files = await res.json();
    
    let sel = document.getElementById('keyTarget');
    if (sel) sel.innerHTML = state.files.map(f => `<option value="${f.id}">${f.name}</option>`).join('');

    let box = document.getElementById('scriptContainer');
    if (box) {
        box.innerHTML = state.files.map(f => `
            <div class="glass rounded-xl p-4 flex justify-between items-center">
                <div>
                    <span class="text-xs font-bold text-purple-400 block">${f.name}</span>
                    <span class="text-[9px] text-slate-500">${f.id} ${f.encrypted ? '🔒 [Encrypted Active]' : '🔓 [Plain]'}</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="editScript('${f.id}')" class="px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-lg text-[10px] cursor-pointer">Edit</button>
                    <button onclick="deleteScript('${f.id}')" class="px-3 py-1 bg-red-500/10 text-red-400 border border-red-500/20 rounded-lg text-[10px] cursor-pointer">Hapus</button>
                </div>
            </div>
        `).join('');
    }
}

function editScript(id) {
    let f = state.files.find(x => x.id === id);
    if (!f) return;
    document.getElementById('editScriptId').value = f.id;
    document.getElementById('scriptName').value = f.name;
    document.getElementById('scriptContent').value = f.content;
    document.getElementById('encryptToggle').checked = f.encrypted || false;
    document.getElementById('editorTitle').innerText = "Mengedit Script: " + f.name;
}

async function saveScript() {
    let id = document.getElementById('editScriptId').value;
    let name = document.getElementById('scriptName').value.trim();
    let content = document.getElementById('scriptContent').value;
    let encrypted = document.getElementById('encryptToggle').checked;

    if (!name || content === '') return alert('Data wajib lengkap!');
    let res = await apiCall('POST', '', { name, content, encrypted, existingScriptId: id });
    if (res.ok) {
        alert('Script cloud berhasil diperbarui!');
        document.getElementById('editScriptId').value = '';
        document.getElementById('scriptName').value = '';
        document.getElementById('scriptContent').value = '';
        document.getElementById('encryptToggle').checked = false;
        document.getElementById('editorTitle').innerText = "Buat Baru Script Cloud";
        fetchScripts();
    }
}

async function deleteScript(id) {
    if (confirm('Hapus Script ini?')) {
        await apiCall('DELETE', '?id=' + id);
        fetchScripts();
    }
}

async function fetchLicenses() {
    let res = await apiCall('GET', '?type=keys');
    if (!res.ok) return;
    state.keys = await res.json();
    updateExpiredCount();

    let box = document.getElementById('licenseContainer');
    box.innerHTML = state.keys.map(k => {
        let isExp = k.expiry ? (new Date() > new Date(k.expiry)) : false;
        return `
            <div class="glass rounded-xl p-4 space-y-2">
                <div class="flex justify-between items-center">
                    <span class="mono text-xs font-bold ${isExp ? 'text-red-400 line-through' : 'text-emerald-400'}">${k.key}</span>
                    <button onclick="deleteKey('${k.key}')" class="text-[10px] text-red-400 bg-red-500/10 px-2 py-0.5 rounded cursor-pointer">Hapus</button>
                </div>
                <div class="text-[10px] text-slate-400 flex justify-between">
                    <span>Script: ${k.target_script_name}</span>
                    <span>Device: ${k.registered_devices ? k.registered_devices.length : 0}/${k.max_devices}</span>
                    <span>Expired: ${k.expiry ? new Date(k.expiry).toLocaleDateString('id-ID') : 'Permanen'}</span>
                </div>
            </div>
        `;
    }).join('');
}

async function generateLicense() {
    let scriptId = document.getElementById('keyTarget').value;
    let maxDevices = document.getElementById('keyMaxDevices').value;
    let preset = document.getElementById('keyExpiryPreset').value;
    let customName = document.getElementById('keyCustomName').value.trim();
    
    let expiry = '';
    if (preset === 'permanent') {
        expiry = 'permanent';
    } else if (preset === 'custom') {
        expiry = document.getElementById('keyExpiryCustom').value;
        if (!expiry) return alert('Pilih tanggal kustom!');
    } else {
        let days = parseInt(preset);
        let d = new Date();
        d.setDate(d.getDate() + days);
        expiry = d.toISOString();
    }

    let res = await apiCall('POST', '', { action: 'createKey', scriptId, expiry, maxDevices, customName });
    if (res.ok) {
        alert('Lisensi berhasil ditambahkan!');
        document.getElementById('keyCustomName').value = '';
        fetchLicenses();
    }
}

async function deleteKey(k) {
    if (confirm('Hapus lisensi ini?')) {
        await apiCall('DELETE', '?deleteKey=' + k);
        fetchLicenses();
    }
}

async function doLogin() {
    let email = document.getElementById('lE').value.trim();
    let password = document.getElementById('lP').value;
    let res = await fetch('/api/server', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'login', email, password }) });
    if (res.ok) {
        let d = await res.json();
        state.token = d.session;
        localStorage.setItem('nx_session', d.session);
        document.getElementById('authGate').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        document.getElementById('userEmail').innerText = email;
        sw('beranda');
    } else alert('Kombinasi login salah!');
}

function doLogout() {
    localStorage.removeItem('nx_session');
    location.reload();
}

window.onload = function() {
    let saved = localStorage.getItem('nx_session');
    if (saved) {
        state.token = saved;
        document.getElementById('authGate').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        sw('beranda');
    }
}
</script>
</body>
</html>
