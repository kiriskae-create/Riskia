<!--NX-V3-->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEXUS X</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
*{touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');
body{font-family:'Inter',sans-serif;background:#05060a;color:#e2e8f0;overflow-x:hidden;overscroll-behavior:none}
.mono{font-family:'JetBrains Mono',monospace}
.sb{position:fixed;left:0;top:0;bottom:0;width:58px;background:#080a10;border-right:1px solid rgba(245,158,11,.07);display:flex;flex-direction:column;z-index:60;contain:layout style}
.sb-logo{display:flex;align-items:center;justify-content:center;height:58px;border-bottom:1px solid rgba(245,158,11,.07)}
.sb-nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:8px 0}
.si{display:flex;align-items:center;justify-content:center;width:42px;height:42px;margin:0 auto;border-radius:12px;color:#475569;cursor:pointer;border:none;background:none;transition:background .12s,color .12s}
.si:active{transform:scale(.92)}
.si svg{width:20px;height:20px;flex-shrink:0;pointer-events:none}
.si .sl{display:none}
.si.on{background:rgba(245,158,11,.1);color:#fbbf24}
.sf{border-top:1px solid rgba(245,158,11,.07);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.sf .se{display:none}
.sf .si{width:38px;height:38px}
@media(min-width:768px){
.sb{width:210px}
.sb-logo{justify-content:flex-start;padding:0 18px;gap:10px}
.si{width:auto;height:42px;margin:0 8px;justify-content:flex-start;padding:0 14px;gap:11px;border-radius:10px}
.si.on{border-left:3px solid #f59e0b}
.si .sl{display:inline;font-size:11px;font-weight:500;white-space:nowrap}
.sf{align-items:stretch;padding:12px 8px}
.sf .se{display:block;font-size:9px;color:#475569;padding:0 14px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf .si{width:auto;justify-content:flex-start;padding:0 14px;gap:11px;margin:0 8px}
}
.mn{margin-left:58px;padding:16px;min-height:100vh;contain:layout style}
@media(min-width:768px){.mn{margin-left:210px;padding:28px}}
.cd{background:#0d0f16;border:1px solid rgba(245,158,11,.07);border-radius:14px;padding:18px}
@media(min-width:768px){.cd{background:rgba(15,17,25,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}}
.cb{border-color:rgba(59,130,246,.12)}.cg{border-color:rgba(245,158,11,.12)}
.ce{background:rgba(30,41,59,.6)!important;border-color:rgba(59,130,246,.25)!important}
.bg{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;font-weight:700;border:none;cursor:pointer}.bg:active{transform:scale(.97)}
.bb{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:700;border:none;cursor:pointer}.bb:active{transform:scale(.97)}
.bs{background:rgba(255,255,255,.04);color:#94a3b8;font-weight:600;border:1px solid rgba(255,255,255,.06);cursor:pointer}
.ip{background:rgba(5,6,10,.8);border:1px solid rgba(245,158,11,.08);color:#e2e8f0;outline:none}.ip:focus{border-color:rgba(245,158,11,.35)}
#ag{position:fixed;inset:0;z-index:100;background:#05060a;display:flex;align-items:center;justify-content:center}
.ab{width:100%;max-width:340px;margin:0 16px}
.gx{background:linear-gradient(135deg,#fbbf24,#f59e0b,#d97706);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:8px;font-weight:700;letter-spacing:.4px}
.fl{width:1.5px;height:18px;background:rgba(245,158,11,.12);margin:0 auto}
#toast{position:fixed;bottom:20px;right:20px;background:#f59e0b;color:#000;padding:10px 16px;border-radius:10px;font-size:11px;font-weight:700;opacity:0;transition:opacity .25s;z-index:200;pointer-events:none}
</style>
</head>
<body>
<div id="ag">
<div class="ab">
<div class="text-center mb-5">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500/15 to-orange-600/5 border border-amber-500/15 mb-2.5">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg>
</div>
<h1 class="text-lg font-bold gx tracking-tight">NEXUS X CLOUD</h1>
<p class="text-[9px] text-slate-600 mt-0.5 tracking-widest">ADMIN PANEL</p>
</div>
<div class="flex mb-3.5 gap-1 bg-black/30 p-1 rounded-xl border border-amber-500/5">
<button id="tR" onclick="stab('r')" class="flex-1 py-2 rounded-lg text-[11px] font-semibold cursor-pointer bg-amber-500/12 text-amber-400 border border-amber-500/25">Register</button>
<button id="tL" onclick="stab('l')" class="flex-1 py-2 rounded-lg text-[11px] font-semibold cursor-pointer text-slate-500 border border-transparent">Login</button>
</div>
<div id="fR" class="cd cg p-4 space-y-2.5">
<input type="email" id="rE" placeholder="Gmail" class="w-full px-3.5 py-2.5 rounded-xl ip text-xs mono">
<input type="password" id="rP" placeholder="Password" class="w-full px-3.5 py-2.5 rounded-xl ip text-xs mono">
<button onclick="doReg()" class="w-full py-2.5 rounded-xl bg text-xs">Register</button>
</div>
<div id="fC" class="cd cg p-4 space-y-3 hidden text-center">
<h3 class="text-xs font-bold text-white">Security Key</h3>
<div class="p-3 bg-black/40 rounded-xl tracking-[.2em] font-black gx mono text-sm" id="cD">------</div>
<button onclick="goL()" class="w-full py-2.5 rounded-xl bg text-xs">Proceed Login</button>
</div>
<div id="fL" class="cd cg p-4 space-y-2.5 hidden">
<input type="email" id="lE" placeholder="Gmail" class="w-full px-3.5 py-2.5 rounded-xl ip text-xs mono">
<input type="password" id="lP" placeholder="Password" class="w-full px-3.5 py-2.5 rounded-xl ip text-xs mono">
<button onclick="doLog()" class="w-full py-2.5 rounded-xl bg text-xs">Login</button>
</div>
</div>
</div>
<aside class="sb" id="sb">
<div class="sb-logo">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2"/><line x1="12" y1="22" x2="12" y2="15.5"/><polyline points="22 8.5 12 15.5 2 8.5"/></svg>
<span class="sl text-xs font-bold text-white tracking-wide">NEXUS</span>
</div>
<nav class="sb-nav">
<button class="si on" id="n-b" onclick="sw('b')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
<span class="sl">Overview</span>
</button>
<button class="si" id="n-g" onclick="sw('g')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
<span class="sl">Scripts</span>
</button>
<button class="si" id="n-k" onclick="sw('k')">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78Zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
<span class="sl">Licenses</span>
</button>
</nav>
<div class="sf">
<p class="se mono" id="aE">user@nexus.io</p>
<button class="si" onclick="doOut()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
<span class="sl">Disconnect</span>
</button>
</div>
</aside>
<main class="mn" id="mn">
<div id="v-b" class="space-y-4">
<h2 class="text-base font-bold text-white">Overview</h2>
<div class="cd space-y-0">
<div class="flex items-start gap-3"><div class="flex flex-col items-center pt-0.5"><span class="tg bg-emerald-500/10 text-emerald-400 border border-emerald-500/15">L1</span><div class="fl"></div></div><div class="flex-1 pb-2"><p class="text-[11px] font-bold text-white">Loader</p><div class="mt-1.5 flex items-center gap-2"><code class="text-[9px] text-emerald-400/60 mono bg-emerald-500/5 px-2 py-1 rounded border border-emerald-500/8 truncate flex-1 min-w-0" id="d1">-</code><button onclick="C(d1.innerText)" class="shrink-0 px-2 py-1 bg-emerald-500/8 text-emerald-400 border border-emerald-500/15 rounded text-[9px] font-bold cursor-pointer">COPY</button></div></div></div>
<div class="flex items-start gap-3"><div class="flex flex-col items-center pt-0.5"><span class="tg bg-blue-500/10 text-blue-400 border border-blue-500/15">L2</span><div class="fl"></div></div><div class="flex-1 pb-2"><p class="text-[11px] font-bold text-white">Login</p><div class="mt-1.5 flex items-center gap-2"><code class="text-[9px] text-blue-400/60 mono bg-blue-500/5 px-2 py-1 rounded border border-blue-500/8 truncate flex-1 min-w-0" id="d2">-</code><button onclick="C(d2.innerText)" class="shrink-0 px-2 py-1 bg-blue-500/8 text-blue-400 border border-blue-500/15 rounded text-[9px] font-bold cursor-pointer">COPY</button></div></div></div>
<div class="flex items-start gap-3"><div class="flex flex-col items-center pt-0.5"><span class="tg bg-amber-500/10 text-amber-400 border border-amber-500/15">L3</span></div><div class="flex-1"><p class="text-[11px] font-bold text-white">Menu</p><div class="mt-1.5 flex items-center gap-2"><code class="text-[9px] text-amber-400/60 mono bg-amber-500/5 px-2 py-1 rounded border border-amber-500/8 truncate flex-1 min-w-0" id="d3">-</code><button onclick="C(d3.innerText)" class="shrink-0 px-2 py-1 bg-amber-500/8 text-amber-400 border border-amber-500/15 rounded text-[9px] font-bold cursor-pointer">COPY</button></div></div></div>
</div>
<div class="cd cb">
<h3 class="text-[11px] font-bold text-blue-400 mb-1.5">Loader URL (Generic)</h3>
<p class="text-[9px] text-slate-600 mb-2.5">User input key di dialog login.</p>
<textarea id="ldB" rows="2" readonly class="w-full px-2.5 py-2 rounded-xl bg-black/30 border border-blue-500/8 text-[9px] text-blue-400 mono resize-none"></textarea>
<button onclick="C(ldB.value)" class="w-full mt-2.5 py-2 rounded-xl bb text-[11px]">Copy Loader URL</button>
</div>
<div class="cd cg">
<h3 class="text-[11px] font-bold text-amber-400 mb-1.5">Hook Script (Generic)</h3>
<p class="text-[9px] text-slate-600 mb-2.5">Bypass gg.getFile, user input key di dialog.</p>
<textarea id="hkB" rows="2" readonly class="w-full px-2.5 py-2 rounded-xl bg-black/30 border border-amber-500/8 text-[9px] text-emerald-400 mono resize-none"></textarea>
<button onclick="C(hkB.value)" class="w-full mt-2.5 py-2 rounded-xl bg text-[11px]">Copy Hook</button>
</div>
</div>
<div id="v-g" class="space-y-4 hidden">
<h2 class="text-base font-bold text-white">Scripts</h2>
<div id="eC" class="cd ce space-y-3">
<div class="flex justify-between items-center">
<h3 class="text-[11px] font-bold text-white flex items-center gap-2"><span id="eI"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span><span id="eN">New Script</span></h3>
<button onclick="rE()" id="rB" class="hidden text-[10px] text-red-400 underline cursor-pointer">Batal</button>
</div>
<input type="hidden" id="eId">
<input type="text" id="fN" placeholder="filename.lua" class="w-full px-3 py-2.5 rounded-xl ip text-[11px] mono">
<textarea id="fC" rows="10" placeholder="-- script..." class="w-full px-3 py-2.5 rounded-xl ip text-[10px] mono resize-none"></textarea>
<button id="dB" onclick="dp()" class="w-full py-2.5 rounded-xl bg text-[11px]">Save & Deploy</button>
</div>
<div id="fLi" class="space-y-2"></div>
</div>
<div id="v-k" class="space-y-4 hidden">
<h2 class="text-base font-bold text-white">Licenses</h2>
<div class="cd space-y-3">
<h3 class="text-[11px] font-bold text-white">Generate Key</h3>
<div class="grid grid-cols-1 gap-2.5">
<div><label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Target</label><select id="kT" class="w-full px-3 py-2.5 rounded-xl ip text-[10px] mono"></select></div>
<div class="grid grid-cols-2 gap-2.5">
<div><label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Devices</label><input type="number" id="kM" value="1" class="w-full px-3 py-2.5 rounded-xl ip text-[10px] mono"></div>
<div><label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Expiry</label><input type="datetime-local" id="kE" class="w-full px-3 py-2.5 rounded-xl ip text-[10px] mono"></div>
</div>
<div><label class="block text-[9px] font-bold text-slate-500 mb-1 uppercase tracking-wider">Custom Name</label><input type="text" id="kC" placeholder="VIP-ALPHA" class="w-full px-3 py-2.5 rounded-xl ip text-[10px] mono"></div>
</div>
<button onclick="gK()" class="w-full py-2.5 rounded-xl bg text-[11px]">Generate</button>
</div>
<div id="kL" class="space-y-2.5"></div>
</div>
</main>
<div id="toast"><span id="tM"></span></div>
<script>
var S={f:[],k:[],s:'',c:'b'};
function T(m){var t=document.getElementById('toast');document.getElementById('tM').innerText=m;t.style.opacity='1';setTimeout(function(){t.style.opacity='0'},2200)}
function C(t){navigator.clipboard.writeText(t);T('Copied!')}
function sw(t){S.c=t;['b','g','k'].forEach(function(m){document.getElementById('v-'+m).style.display='none';document.getElementById('n-'+m).classList.remove('on')});document.getElementById('v-'+t).style.display='';document.getElementById('n-'+t).classList.add('on');if(t==='b')iB();if(t==='g')lF();if(t==='k'){lF();lK()}}
function iB(){var b=location.origin;document.getElementById('d1').innerText=b+'/api/server?type=loader';document.getElementById('d2').innerText=b+'/api/server?type=login';document.getElementById('d3').innerText=b+'/api/server?type=menu&id=...';document.getElementById('ldB').value=b+'/api/server?type=loader';document.getElementById('hkB').value='local A=gg.getFile() gg.getFile=function() return A end local V=gg.makeRequest("'+b+'/api/server?type=loader").content if V then pcall(load(V)) end'}
async function ap(m,u,b){var o={method:m,headers:{'Content-Type':'application/json'}};if(S.s)o.headers['X-Session']=S.s;if(b)o.body=JSON.stringify(b);return fetch('/api/server'+u,o)}
async function lF(){var r=await ap('GET','');if(!r.ok)return;S.f=await r.json();var s=document.getElementById('kT');if(s)s.innerHTML=S.f.map(function(f){return'<option value="'+f.id+'">'+f.name+'</option>'}).join('');var c=document.getElementById('fLi');c.innerHTML=S.f.map(function(f){var rl=location.origin+'/api/server?type=raw&id='+f.id;return'<div class="cd flex flex-col sm:flex-row justify-between sm:items-center gap-2.5"><div><span class="mono text-[11px] font-bold text-amber-400">'+f.name+'</span><div class="text-[8px] text-slate-600 mt-0.5 mono">'+f.id+'</div></div><div class="flex gap-1.5"><button onclick="C(\''+rl+'\')" class="px-2 py-1 bg-emerald-500/8 text-emerald-400 border border-emerald-500/12 rounded-lg text-[9px] font-bold cursor-pointer">Raw</button><button onclick="eF(\''+f.id+'\')" class="px-2 py-1 bg-blue-500/8 text-blue-400 border border-blue-500/12 rounded-lg text-[9px] font-bold cursor-pointer">Edit</button><button onclick="dF(\''+f.id+'\')" class="px-2 py-1 bg-red-500/8 text-red-400 border border-red-500/12 rounded-lg text-[9px] font-bold cursor-pointer">Del</button></div></div>'}).join('')}
function eF(id){var t=S.f.find(function(f){return f.id===id});if(!t)return;document.getElementById('eId').value=id;document.getElementById('fN').value=t.name;document.getElementById('fC').value=t.content;document.getElementById('eC').classList.add('ce');document.getElementById('eN').innerText='Edit: '+t.name;var d=document.getElementById('dB');d.className='w-full py-2.5 rounded-xl bb text-[11px]';d.innerText='Update';document.getElementById('rB').style.display='';window.scrollTo({top:0,behavior:'smooth'})}
function rE(){document.getElementById('eId').value='';document.getElementById('fN').value='';document.getElementById('fC').value='';document.getElementById('eC').classList.remove('ce');document.getElementById('eN').innerText='New Script';var d=document.getElementById('dB');d.className='w-full py-2.5 rounded-xl bg text-[11px]';d.innerText='Save & Deploy';document.getElementById('rB').style.display='none'}
async function dp(){var n=document.getElementById('fN').value.trim(),c=document.getElementById('fC').value,e=document.getElementById('eId').value;if(!n||!c)return T('Empty!');var r=await ap('POST','',{name:n,content:c,existingScriptId:e});if(r.ok){T(e?'Updated!':'Saved!');rE();lF()}else T('Failed.')}
function cH(key){var u=location.origin+'/api/server?key='+key;C('local A=gg.getFile() gg.getFile=function() return A end local V=gg.makeRequest("'+u+'").content if V then pcall(load(V)) end')}
async function lK(){var r=await ap('GET','?type=keys');if(!r.ok)return;S.k=await r.json();var c=document.getElementById('kL');c.innerHTML=S.k.map(function(k){var ed=new Date(k.expiry),exp=new Date()>ed,dc=k.registered_devices?k.registered_devices.length:0;var kc=exp?'text-red-400 line-through':'text-amber-400',ec=exp?'text-red-400 font-bold':'text-slate-400';var bg=exp?'<span class="tg bg-red-500/10 text-red-400 border border-red-500/15">EXPIRED</span>':'<span class="tg bg-emerald-500/10 text-emerald-400 border border-emerald-500/15">ACTIVE</span>';return'<div class="cd space-y-2.5"><div class="flex justify-between items-start gap-2"><div class="min-w-0"><div class="flex items-center gap-2 flex-wrap"><span class="mono text-[11px] font-bold '+kc+' break-all">'+k.key+'</span>'+bg+'</div></div><button onclick="dK(\''+k.key+'\')" class="shrink-0 px-2 py-1 bg-red-500/8 text-red-400 border border-red-500/12 rounded-lg text-[9px] font-bold cursor-pointer">Del</button></div><div class="flex flex-wrap gap-x-3 gap-y-1 text-[9px] text-slate-500 mono pt-2 border-t border-slate-800/50"><div>Module: <span class="text-white font-semibold">'+k.target_script_name+'</span></div><div>Dev: <span class="text-emerald-400 font-bold">'+dc+'/'+k.max_devices+'</span></div><div>Exp: <span class="'+ec+'">'+ed.toLocaleDateString('id-ID')+'</span></div></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><button onclick="cH(\''+k.key+'\')" class="py-2 bg-amber-500/8 text-amber-400 border border-amber-500/12 text-[10px] font-bold rounded-xl cursor-pointer text-center active:bg-amber-500/15">Loader URL (Key: '+k.key+')</button><button onclick="C(\''+location.origin+'/api/server?type=login\')" class="py-2 bg-blue-500/8 text-blue-400 border border-blue-500/12 text-[10px] font-bold rounded-xl cursor-pointer text-center active:bg-blue-500/15">Login URL (Input Key)</button></div></div>'}).join('')}
async function gK(){var s=document.getElementById('kT').value,m=document.getElementById('kM').value,e=document.getElementById('kE').value,c=document.getElementById('kC').value.trim();if(!s||!e)return T('Fill required!');var r=await ap('POST','',{action:'createKey',scriptId:s,expiry:e,maxDevices:m,customName:c});if(r.ok){T('Generated!');document.getElementById('kC').value='';lK()}}
async function dF(id){if(confirm('Delete?')){await ap('DELETE','?id='+id);lF();T('Deleted!')}}
async function dK(k){if(confirm('Delete?')){await ap('DELETE','?deleteKey='+k);lK();T('Deleted!')}}
function stab(t){document.getElementById('fR').style.display=t==='r'?'':'none';document.getElementById('fL').style.display=t==='l'?'':'none';document.getElementById('tR').className='flex-1 py-2 rounded-lg text-[11px] font-semibold cursor-pointer '+(t==='r'?'bg-amber-500/12 text-amber-400 border border-amber-500/25':'text-slate-500 border border-transparent');document.getElementById('tL').className='flex-1 py-2 rounded-lg text-[11px] font-semibold cursor-pointer '+(t==='l'?'bg-amber-500/12 text-amber-400 border border-amber-500/25':'text-slate-500 border border-transparent')}
async function doReg(){var e=document.getElementById('rE').value.trim(),p=document.getElementById('rP').value;var r=await fetch('/api/server',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register',email:e,password:p})});if(r.ok){var d=await r.json();document.getElementById('cD').innerText=d.code;document.getElementById('fR').style.display='none';document.getElementById('fC').style.display=''}}
async function doLog(){var e=document.getElementById('lE').value.trim(),p=document.getElementById('lP').value;var r=await fetch('/api/server',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:e,password:p})});if(r.ok){var d=await r.json();S.s=d.session;localStorage.setItem('nx_session',d.session);document.getElementById('ag').style.display='none';document.getElementById('sb').style.display='';document.getElementById('mn').style.display='';document.getElementById('aE').innerText=e;sw('b')}else T('Failed!')}
function goL(){document.getElementById('fC').style.display='none';stab('l')}
function doOut(){localStorage.removeItem('nx_session');location.reload()}
window.onload=function(){var c=localStorage.getItem('nx_session');if(c){S.s=c;document.getElementById('ag').style.display='none';document.getElementById('sb').style.display='';document.getElementById('mn').style.display='';sw('b')}};
</script>
